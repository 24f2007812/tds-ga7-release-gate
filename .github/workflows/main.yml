name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: "TDS identity: 24f2007812@ds.study.iitm.ac.in"
        run: echo "Identity matched and verified."
        
      - name: Run Pytest
        run: pytest test_main.py